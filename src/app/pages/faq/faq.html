<section class="page">
  <header class="hero">
    <h1>FAQ</h1>
    <p class="lede">
      Short answers about search, Applications, and what <span class="brand-inline">Job<em>Finder</em></span> does — and does not — do for
      you. For the full walkthrough, see
      <a routerLink="/how-it-works">How <span class="brand-inline">Job<em>Finder</em></span> Works</a>.
    </p>
  </header>

  <div class="panel">
    @for (item of items; track item.question) {
      <details>
        <summary [innerHTML]="item.question"></summary>
        <p [innerHTML]="item.answer"></p>
      </details>
    }
  </div>
</section>
